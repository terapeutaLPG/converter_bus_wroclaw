name: Convert GTFS to JSON

on:
  push:
    branches:
      - main
    paths:
      - 'routes.txt'
      - 'trips.txt'
      - 'stop_times.txt'
      - 'stops.txt'
      - 'calendar.txt'
      - 'calendar_dates.txt'
      - 'convert.py'
      - '.github/workflows/convert-gtfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pandas

      - name: Convert GTFS files
        run: python convert.py

      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/transit

          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi

          git commit -m "chore: update converted transit data"
          git push
